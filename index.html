bottom:1px solid var(--line);padding:12px 0}.item:last-child{border:0}.item-title{font-weight:600;font-size:15px}.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.score button{min-height:46px;background:var(--bg);color:var(--muted);padding:5px 2px}.score button.on{background:var(--accent);color:white}.status{font-size:13px;color:var(--green);font-weight:600}.status.err{color:#be2c2c}nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px;z-index:5}nav button{background:transparent;color:var(--muted);flex:1;max-width:200px;font-size:12px;padding:5px 2px;line-height:1.4}nav button span{display:block;font-size:21px}nav button.active{color:var(--accent)}.history{width:100%;text-align:left;background:var(--bg);color:var(--text);margin-top:9px;display:flex;justify-content:space-between;align-items:center;gap:12px}.history strong{display:block;font-size:16px}.metric{padding:12px 0;border-bottom:1px solid var(--line)}.bar{height:9px;background:var(--bg);border-radius:8px;overflow:hidden;margin:5px 0}.bar b{height:100%;display:block;border-radius:8px;background:var(--accent)}.bar.old b{background:#8595a6}.delta{font-size:14px;font-weight:600}.empty{text-align:center;color:var(--muted);padding:30px 12px}.badge{font-size:12px;color:var(--accent);background:var(--soft);padding:4px 9px;border-radius:20px}.hide{display:none!important}#alert{position:sticky;top:env(safe-area-inset-top);background:var(--surface);border-radius:10px;z-index:4;color:#ba2c2c;padding:12px;display:none}.summary{font-weight:600;font-size:14px;color:var(--muted)}@media(min-width:720px){main{padding-left:24px;padding-right:24px}.editor{display:grid;grid-template-columns:minmax(250px,.85fr) minmax(350px,1.5fr);gap:16px;align-items:start}.criteria{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}.item:nth-last-child(2){border-bottom:0}header{padding-left:24px}h1{font-size:34px}.wide{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:430px){h1{font-size:25px}main{padding-left:9px;padding-right:9px}.card{padding:12px!important}.seg button{font-size:14px}.summary{width:100%}}@media(prefers-color-scheme:dark){:root{--bg:#111115;--surface:#202026;--text:#f4f4f7;--muted:#a8a8b1;--line:#35353c;--accent:#3995ff;--soft:#1b344f;--green:#65d394}button.primary,.score button.on{color:#fff}} 
/* v3: constrain native date control inside its own clipped hit area. */
.editor>* ,.card,.field,.grid>*{min-width:0;max-width:100%}

.lesson-fields{grid-template-columns:minmax(0,1fr)!important;gap:8px}

<body><header><div class="small">Scratch 動畫競賽・教師專用</div><h1>選手觀察日誌</h1><div id="cloud-status" class="small" role="status">雲端：尚未連線</div><div id="status" class="status" role="status">正在讀取本機紀錄…</div></header><main><div id="alert" role="alert"></div><div id="screen"></div></main><nav aria-label="主要功能"><button data-tab="edit"><span>✎</span>課堂紀錄</button><button data-tab="history"><span>▤</span>歷史紀錄</button><button data-tab="compare"><span>▥</span>進步比較</button><button data-tab="settings"><span>⚙</span>設定與備份</button></nav>
<script>
'use strict';const C=['基本 Scratch 操作','理解新技巧的能力','故事發想與創意','遇到問題會自行嘗試','願意傾聽搭檔','能主動參與及協助'];const I=['A','B','C','D'];const KEY='scratch-observer-v1';const $=(id)=>document.getElementById(id);const root=$('screen');const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);const newRecord=()=>({id:uid(),date:localDate(),title:'',scores:I.map(()=>C.map(()=>null)),notes:I.map(()=>''),team:'',pair:'',updated:new Date().toISOString()});let cloudHook=()=>{};let storageOk=true;let state={version:1,names:['A','B','C','D'],records:[],active:null};function valid(s){return s&&s.version===1&&Array.isArray(s.names)&&s.names.length===4&&s.names.every(n=>typeof n==='string'&&n.length<=60)&&Array.isArray(s.records)&&s.records.every(r=>r&&typeof r.id==='string'&&typeof r.date==='string'&&typeof r.title==='string'&&Array.isArray(r.scores)&&r.scores.length===4&&r.scores.every(a=>Array.isArray(a)&&a.length===6&&a.every(v=>v===null||[1,2,3].includes(v)))&&Array.isArray(r.notes)&&r.notes.length===4&&r.notes.every(n=>typeof n==='string')&&typeof r.team==='string'&&typeof r.pair==='string'&&typeof r.updated==='string')&&new Set(s.records.map(r=>r.id)).size===s.records.length}try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(!valid(data))throw Error('格式異常');state=data}}catch(e){storageOk=false;showError('無法讀取本機資料，請先匯入備份或換用正常 Safari 網頁。現有資料不會被自動覆蓋。')}
if(!state.records.length){const r=newRecord();r.title='第一堂課・意想不到的相遇';state.records.push(r);state.active=r.id}if(!state.records.some(r=>r.id===state.active))state.active=state.records[0].id;
let tab='edit',person=0,comparePerson=0,cmpA='',cmpB='';const rec=()=>state.records.find(r=>r.id===state.active);function showError(t){$('alert').textContent=t;$('alert').style.display='block'}function clearError(){$('alert').style.display='none'}function save(touch=true){if(touch&&rec())rec().updated=new Date().toISOString();try{if(!storageOk)throw Error('尚未恢復');localStorage.setItem(KEY,JSON.stringify(state));cloudHook();$('status').className='status';$('status').textContent='已自動儲存於本機 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}catch(e){$('status').className='status err';$('status').textContent='尚未儲存！請立即匯出備份';showError('本機儲存失敗。請勿關閉頁面，先到設定匯出 JSON。')}}function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function append(parent,...children){for(const c of children)parent.append(c);return parent}function btn(txt,fn,cls=''){const b=el('button',cls,txt);b.type='button';b.onclick=fn;return b}function field(label,value,fn,type='text'){const wrap=el('div');const lab=el('label','',label);const x=el(type==='textarea'?'textarea':'input');wrap.classList.add('field');if(type!=='textarea')x.type=type;if(type==='date'){const dateBox=el('div','date-box');const dateText=el('span','date-text',value||'選擇日期');x.value=value;x.setAttribute('aria-label',label);x.oninput=()=>{dateText.textContent=x.value||'選擇日期';fn(x.value)};dateBox.append(dateText,x);return append(wrap,lab,dateBox)}x.value=value;x.setAttribute('aria-label',label);x.oninput=()=>fn(x.value);return append(wrap,lab,x)}function card(title){return append(el('section','card'),el('h2','',title))}function studentTabs(index,fn){const seg=el('div','seg');I.forEach((k,i)=>seg.append(btn(state.names[i]||k,()=>fn(i),i===index?'active':'')));return seg}function count(r){return r.scores.flat().filter(v=>v!==null).length}function sorted(){return [...state.records].sort((a,b)=>b.date.localeCompare(a.date)||b.updated.localeCompare(a.updated))}function render(){root.replaceChildren();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({edit:edit,history:history,compare:compare,settings:settings})[tab]()}function go(t){tab=t;render();window.scrollTo(0,0)}
function edit(){const r=rec();const layout=el('div','editor'), left=el('div','editor-info'), right=el('div','editor-observe');root.append(layout);layout.append(left,right);const c=card('本堂課');c.classList.add('lesson-card');left.append(c);const g=el('div','grid lesson-fields');g.append(field('日期',r.date,v=>{r.date=v;save()},'date'),field('課程主題',r.title,v=>{r.title=v;save()}));c.append(g);c.append(field('搭檔分組',r.pair,v=>{r.pair=v;save()}));const row=el('div','row between');const sum=el('span','summary',`${count(r)} / 24 項已觀察`);sum.id='progress';row.append(sum,btn('＋ 新增課堂',()=>{const n=newRecord();state.records.push(n);state.active=n.id;save();render()},'primary'));c.append(row);const t=card('團隊合作備註');t.classList.add('team-card');t.append(field('兩組的合作、交接或分工情形',r.team,v=>{r.team=v;save()},'textarea'));left.append(t);const e=card('培訓觀察');e.classList.add('observe-card');right.append(e);e.append(studentTabs(person,i=>{person=i;render()}));const renameRow=el('div','row between');renameRow.append(el('p','small','— 尚未觀察　1 需要引導　2 逐漸熟悉　3 表現良好'),btn('修改學生名稱',()=>go('settings')));e.append(renameRow);const crit=el('div','criteria');e.append(crit);C.forEach((name,j)=>{const item=el('div','item');item.append(el('div','item-title',name));const scores=el('div','score');[null,1,2,3].forEach(v=>{const b=btn(v===null?'—':String(v),()=>{r.scores[person][j]=v;save();scores.querySelectorAll('button').forEach((x,k)=>{const on=[null,1,2,3][k]===v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',String(on))});$('progress').textContent=`${count(r)} / 24 項已觀察`},r.scores[person][j]===v?'on':'');b.setAttribute('aria-label',name+'：'+(v===null?'尚未觀察':v));b.setAttribute('aria-pressed',String(r.scores[person][j]===v));scores.append(b)});item.append(scores);crit.append(item)});e.append(field('個人觀察與下一步',r.notes[person],v=>{r.notes[person]=v;save()},'textarea'));e.append(el('p','small','每次點選或輸入即儲存；不需要按送出。'))}
function history(){const c=card('歷次課堂');root.append(c);c.append(el('p','small',`共 ${state.records.length} 筆；點開即可補記或修改。`));for(const r of sorted()){const b=btn('',()=>{state.active=r.id;save(false);go('edit')},'history');const l=el('div');l.append(el('strong','',r.title||'未命名課程'),el('small','',r.date+' ・ '+count(r)+'/24 項觀察'));b.append(l,el('span','','›'));c.append(b)}}
function comparisonSelect(label,current,fn,rs){const w=el('div');w.append(el('label','',label));const s=el('select');s.setAttribute('aria-label',label);for(const r of rs){const o=el('option','',`${r.date}｜${r.title||'未命名'}`);o.value=r.id;s.append(o)}s.value=current;s.onchange=()=>fn(s.value);w.append(s);return w}
function compare(){const rs=sorted();const c=card('進步比較');root.append(c);if(rs.length<2){c.append(el('div','empty','完成至少兩堂課後，就能比較每次的六項能力。'));return}if(!rs.some(r=>r.id===cmpA))cmpA=rs[1].id;if(!rs.some(r=>r.id===cmpB))cmpB=rs[0].id;const g=el('div','grid');g.append(comparisonSelect('基準課堂',cmpA,v=>{cmpA=v;render()},rs),comparisonSelect('比較課堂',cmpB,v=>{cmpB=v;render()},rs));c.append(g,studentTabs(comparePerson,i=>{comparePerson=i;render()}));const a=rs.find(r=>r.id===cmpA),b=rs.find(r=>r.id===cmpB);c.append(el('p','small','灰色＝基準；藍色＝比較。— 表示尚未觀察，不當作 0 分。'));C.forEach((name,j)=>{const x=a.scores[comparePerson][j],y=b.scores[comparePerson][j];const m=el('div','metric');const top=el('div','row between');top.append(el('strong','',name),el('span','delta',x===null||y===null?'未能比較':(y-x>0?'+':'')+(y-x)));m.append(top);[[x,'old'],[y,'']].forEach(([v,cls],i)=>{const row=el('div','small',`${i===0?'基準':'比較'}：${v===null?'—':v+' / 3'}`);const bar=el('div','bar '+cls);const fill=el('b');fill.style.width=(v===null?0:v/3*100)+'%';bar.append(fill);m.append(row,bar)});c.append(m)});const note=card('文字紀錄');note.append(el('h3','','基準課堂'),el('p','',a.notes[comparePerson]||'尚無備註'),el('h3','','比較課堂'),el('p','',b.notes[comparePerson]||'尚無備註'),el('h3','','團隊備註（基準／比較）'),el('p','',a.team||'尚無備註'),el('p','',b.team||'尚無備註'));root.append(note)}
function download(name,body,mime){const u=URL.createObjectURL(new Blob([body],{type:mime}));const a=el('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}function jsonExport(){download(`Scratch_observations_${localDate()}.json`,JSON.stringify(state,null,2),'application/json')}function csvExport(){const escape=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const rows=[['日期','課程','選手',...C,'個人備註','搭檔','團隊備註']];for(const r of sorted().reverse())I.forEach((_,i)=>rows.push([r.date,r.title,state.names[i],...r.scores[i],r.notes[i],r.pair,r.team]));download(`Scratch_observations_${localDate()}.csv`,'\ufeff'+rows.map(a=>a.map(escape).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function settings(){const cloud=card('雲端帳號與同步');cloud.id='cloud-panel';root.append(cloud);window.dispatchEvent(new Event('observer-settings'));const c=card('學生名稱設定');root.append(c,el('p','small','你可以把 A、B、C、D 改成學生名字或代號。儲存後，課堂紀錄與培訓觀察頁面會立即同步更新。'));const g=el('div','grid');I.forEach((a,i)=>g.append(field('學生 '+a,state.names[i],v=>{state.names[i]=v.slice(0,60);save(false)})));c.append(g);const b=card('資料備份與還原');root.append(b);b.append(el('p','small','本機資料會保留；登入並啟用雲端同步後，可跨裝置使用。清除網站資料、移除 App 或系統清理可能造成遺失。請定期將 JSON 備份存到受保護的「檔案」或 iCloud Drive。'));b.append(append(el('div','grid backup-actions'),btn('匯出 JSON 備份',jsonExport,'primary'),btn('匯出 CSV 紀錄',csvExport)));const file=el('input');file.type='file';file.accept='.json,application/json';file.className='hide';file.onchange=async()=>{try{if(!file.files[0])return;const data=JSON.parse(await file.files[0].text());if(!valid(data))throw Error('格式錯誤');if(!confirm('匯入將取代目前所有紀錄。請確認已匯出目前備份。繼續嗎？'))return;state=data;if(!state.records.length){const r=newRecord();state.records.push(r);state.active=r.id}if(!state.records.some(r=>r.id===state.active))state.active=state.records[0].id;storageOk=true;clearError();save(false);go('history')}catch(e){showError('匯入失敗：請選擇本工具匯出的有效 JSON 備份。')}finally{file.value=''}};b.append(file,btn('從 JSON 還原',()=>file.click(),'restore-action'));const d=card('管理目前課堂');d.append(btn('刪除目前這筆課堂',()=>{if(!confirm('確定刪除目前課堂？此操作無法復原。'))return;state.records=state.records.filter(r=>r.id!==state.active);if(!state.records.length)state.records.push(newRecord());state.active=sorted()[0].id;save(false);go('history')},'danger'));root.append(d);const info=card('使用提醒');info.append(el('p','small','登入後資料將同步至教師專屬 Firestore。登出不會清除本機資料，請勿在共用裝置使用。使用手機鎖定保護，並遵守學校學生資料管理規範。'));root.append(info)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));save(false);render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
window.observerBridge={get:()=>state,valid,apply:(data)=>{if(!valid(data))throw Error('資料格式錯誤');state=data;if(!state.records.length)state.records.push(newRecord());if(!state.records.some(r=>r.id===state.active))state.active=state.records[0].id;save(false);render()},hook:fn=>cloudHook=fn,backup:jsonExport,storage:()=>storageOk};
